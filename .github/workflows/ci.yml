name: Pipeline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_DOTENV_DISABLED: "1"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  POSTGRES_HOST: "127.0.0.1"
  POSTGRES_DB: metro_db
  POSTGRES_USER: metro_user
  POSTGRES_PASSWORD: ci-only-dummy-password
  SEOUL_API_KEY: ci-only-mocked-key

jobs:
  static_and_unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check whitespace in the event's change range
        run: |
          python -B - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              base = event["pull_request"]["base"]["sha"]
          else:
              base = event.get("before", "")
          valid = re.fullmatch(r"[0-9a-fA-F]{40}", base) and set(base) != {"0"}
          if valid:
              available = subprocess.run(
                  ["git", "cat-file", "-e", base + "^{commit}"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
          else:
              available = False
          if not available:
              # Missing predecessor: check the whole tracked tree, not nothing.
              base = subprocess.check_output(
                  ["git", "hash-object", "-w", "-t", "tree", "--stdin"], input=b"",
              ).decode().strip()
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          PY
      - name: Check CI secret boundaries and fixture provenance markers
        run: |
          python -B - <<'PY'
          import os
          import re
          from pathlib import Path
          import subprocess
          import yaml

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          forbidden = [p for p in tracked if Path(p).name == ".env" or (
              Path(p).name.startswith(".env.") and Path(p).name != ".env.example"
          )]
          if forbidden:
              raise SystemExit("Environment credential files must not be tracked")
          assert not Path(".env").exists(), "CI must not load a local .env"
          expected = {
              "POSTGRES_HOST": "127.0.0.1", "POSTGRES_DB": "metro_db",
              "POSTGRES_USER": "metro_user", "POSTGRES_PASSWORD": "ci-only-dummy-password",
              "SEOUL_API_KEY": "ci-only-mocked-key",
          }
          assert all(os.environ.get(k) == v for k, v in expected.items())
          profile = yaml.safe_load(Path("metro_dbt/profiles.yml").read_text())
          output = profile["metro_dbt"]["outputs"]["dev"]
          assert profile["metro_dbt"]["target"] == "dev"
          assert output["type"] == "postgres" and output["port"] == 5432
          for field, variable in {
              "host": "POSTGRES_HOST", "user": "POSTGRES_USER",
              "password": "POSTGRES_PASSWORD", "dbname": "POSTGRES_DB",
          }.items():
              expression = output[field].strip()
              pattern = r"\{\{\s*env_var\(\s*(['\"])" + variable + r"\1(?:\s*,\s*[^)]*)?\s*\)\s*\}\}"
              assert re.fullmatch(pattern, expression), "CI profile must use supplied environment"
          assert not any(os.environ.get(k) for k in (
              "DBT_STORE_FAILURES", "DBT_WARN_ERROR", "DBT_WARN_ERROR_OPTIONS",
          ))
          workflow = Path(".github/workflows/ci.yml").read_text()
          assert "secrets" + "." not in workflow, "No repository secrets are used"
          fixture = Path("tests/fixtures/ci_subway_arrival.sql").read_text()
          assert "CI-only synthetic data" in fixture and "CI_SYNTH_" in fixture
          print("CI credential and synthetic fixture boundaries PASS")
          PY
      - name: Compile Python syntax without importing DAGs
        run: |
          python -B - <<'PY'
          from pathlib import Path
          paths = [p for folder in ("src", "tests", "dags", "scripts")
                   for p in Path(folder).glob("*.py")]
          for path in paths:
              compile(path.read_bytes(), str(path), "exec")
          print(f"Syntax PASS: {len(paths)} files")
          PY
      - name: Run mocked regression tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Validate Compose configuration without starting services
        run: docker compose config --quiet

  postgres_dbt_integration:
    needs: static_and_unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI_SCHEMA_VERIFY: "1"
      CI_RESOURCE_PREFIX: metro-ci-${{ github.run_id }}-${{ github.run_attempt }}-postgres
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Initialize disposable PostgreSQL with the real init SQL
        run: |
          container="${CI_RESOURCE_PREFIX}-db"
          volume="${CI_RESOURCE_PREFIX}-data"
          [[ "$CI_RESOURCE_PREFIX" =~ ^metro-ci-[0-9]+-[0-9]+-postgres$ ]]
          if docker container inspect "$container" >/dev/null 2>&1 ||
             docker volume inspect "$volume" >/dev/null 2>&1; then
            echo "CI resource name collision; refusing to reuse resources" >&2
            exit 1
          fi
          test -f sql/000_create_subway_arrival.sql
          test -f sql/001_create_pipeline_load_history.sql
          docker volume create --label "ci.owner=metro-pipeline" \
            --label "ci.run=$GITHUB_RUN_ID" --label "ci.attempt=$GITHUB_RUN_ATTEMPT" \
            "$volume" >/dev/null
          echo "CI_VOLUME_CREATED=1" >> "$GITHUB_ENV"
          docker run -d --name "$container" \
            --label "ci.owner=metro-pipeline" \
            --label "ci.run=$GITHUB_RUN_ID" --label "ci.attempt=$GITHUB_RUN_ATTEMPT" \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -p 127.0.0.1:5432:5432 \
            --mount "type=volume,source=$volume,target=/var/lib/postgresql/data" \
            --mount "type=bind,source=$PWD/sql/000_create_subway_arrival.sql,target=/docker-entrypoint-initdb.d/000_create_subway_arrival.sql,readonly" \
            --mount "type=bind,source=$PWD/sql/001_create_pipeline_load_history.sql,target=/docker-entrypoint-initdb.d/001_create_pipeline_load_history.sql,readonly" \
            --health-cmd 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            --health-interval 5s --health-timeout 3s --health-retries 10 \
            --health-start-period 30s postgres:17 >/dev/null
          healthy=false
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            running="$(docker inspect --format '{{.State.Running}}' "$container")"
            if [[ "$status" == healthy ]]; then healthy=true; break; fi
            if [[ "$running" != true || "$status" == unhealthy ]]; then
              echo "CI PostgreSQL failed its healthcheck" >&2
              exit 1
            fi
            sleep 2
          done
          [[ "$healthy" == true ]] || { echo "CI PostgreSQL health timeout" >&2; exit 1; }
          python -B - <<'PY'
          import os
          import subprocess
          name = os.environ["CI_RESOURCE_PREFIX"] + "-db"
          logs = subprocess.check_output(["docker", "logs", name], stderr=subprocess.STDOUT).decode()
          first = "running /docker-entrypoint-initdb.d/000_create_subway_arrival.sql"
          second = "running /docker-entrypoint-initdb.d/001_create_pipeline_load_history.sql"
          assert logs.count(first) == logs.count(second) == 1
          assert logs.index(first) < logs.index(second)
          print("PostgreSQL healthy; 000 then 001 executed automatically")
          PY
      - name: Verify initial schema with a read-only connection
        run: python -B scripts/ci_verify_schema.py
      - name: Load and verify synthetic fixture in CI DB only
        run: |
          docker exec -i "${CI_RESOURCE_PREFIX}-db" \
            psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            < tests/fixtures/ci_subway_arrival.sql
          PGOPTIONS="-c default_transaction_read_only=on" python -B - <<'PY'
          import os
          import psycopg
          with psycopg.connect(
              host=os.environ["POSTGRES_HOST"], dbname=os.environ["POSTGRES_DB"],
              user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
          ) as conn:
              row = conn.execute("""
                  SELECT count(*), count(distinct id),
                         count(distinct (station_name, direction, train_line)),
                         bool_and(station_name LIKE 'CI_SYNTH_%'
                              AND train_line LIKE 'CI_SYNTH_%'
                              AND train_no LIKE 'CI%'
                              AND arrival_seconds >= 0)
                  FROM public.subway_arrival
              """).fetchone()
              assert row == (7, 7, 5, True)
          print("Synthetic fixture PASS: 7 rows, 5 grains, generated IDs")
          PY
      - name: Parse dbt project
        run: dbt parse --project-dir metro_dbt --profiles-dir metro_dbt --no-partial-parse
      - name: Verify test configurations before DB execution
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("metro_dbt/target/manifest.json").read_text())
          for node in manifest["nodes"].values():
              assert node["resource_type"] != "operation", "No project run hooks in CI"
              config = node.get("config", {})
              assert not config.get("pre-hook") and not config.get("post-hook")
              if node["resource_type"] == "test":
                  assert not config.get("store_failures")
                  assert config.get("store_failures_as") in (None, "ephemeral")
          print("No failure storage or project hooks configured")
          PY
      - name: Build models in the disposable DB
        run: dbt run --project-dir metro_dbt --profiles-dir metro_dbt
      - name: Run data tests with read-only DB sessions
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: dbt test --project-dir metro_dbt --profiles-dir metro_dbt --fail-fast
      - name: Verify all tests and the intentional duplicate WARN
        run: python -B scripts/ci_verify_dbt_results.py
      - name: Remove only resources owned by this CI run
        if: always()
        run: |
          [[ "$CI_RESOURCE_PREFIX" == "metro-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgres" ]]
          container="${CI_RESOURCE_PREFIX}-db"
          volume="${CI_RESOURCE_PREFIX}-data"
          # Nothing is removed when creation never reached this point.
          if [[ "${CI_VOLUME_CREATED:-}" != 1 ]]; then exit 0; fi
          if docker container inspect "$container" >/dev/null 2>&1; then
            [[ "$(docker inspect -f '{{index .Config.Labels "ci.owner"}}' "$container")" == metro-pipeline ]]
            [[ "$(docker inspect -f '{{index .Config.Labels "ci.run"}}' "$container")" == "$GITHUB_RUN_ID" ]]
            [[ "$(docker inspect -f '{{index .Config.Labels "ci.attempt"}}' "$container")" == "$GITHUB_RUN_ATTEMPT" ]]
            docker container rm -f "$container" >/dev/null
          fi
          if docker volume inspect "$volume" >/dev/null 2>&1; then
            [[ "$(docker volume inspect -f '{{index .Labels "ci.owner"}}' "$volume")" == metro-pipeline ]]
            [[ "$(docker volume inspect -f '{{index .Labels "ci.run"}}' "$volume")" == "$GITHUB_RUN_ID" ]]
            [[ "$(docker volume inspect -f '{{index .Labels "ci.attempt"}}' "$volume")" == "$GITHUB_RUN_ATTEMPT" ]]
            docker volume rm "$volume" >/dev/null
          fi
